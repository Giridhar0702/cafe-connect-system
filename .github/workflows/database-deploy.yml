# =============================================================
# Cafe Connect — Database Migration CI/CD Pipeline
# =============================================================
#
# CI  (validate):        Runs on PRs & pushes to main when
#                        supabase/migrations/** changes.
#                        Spins up a local Supabase stack and
#                        applies all migrations to a clean DB.
#
# CD  (deploy):          Runs ONLY on push to main (never PRs).
#                        Pushes pending migrations to the linked
#                        Supabase development project.
#
# Post-deploy (schema):  Exports the live schema snapshot and
#                        opens a PR so database/schema.sql stays
#                        in sync. Commits from this job carry a
#                        [skip ci] tag to prevent infinite loops.
# =============================================================

name: Database Migrations

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "supabase/migrations/**"

  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (only 'development' is allowed)"
        required: true
        default: "development"
        type: choice
        options:
          - development

# ------------------------------------------------------------------
# Concurrency: serialise all deployments that target the shared dev
# database.  Validation jobs are allowed to overlap.
# ------------------------------------------------------------------
concurrency:
  group: supabase-deploy-${{ github.ref }}
  cancel-in-progress: false

# ------------------------------------------------------------------
# Top-level permissions — restrictive default.
# Individual jobs elevate only what they need.
# ------------------------------------------------------------------
permissions:
  contents: read

# ------------------------------------------------------------------
# Pinned Supabase CLI version — bump deliberately.
# ------------------------------------------------------------------
env:
  SUPABASE_CLI_VERSION: "2.58.5"

# ==================================================================
# JOBS
# ==================================================================
jobs:
  # ----------------------------------------------------------------
  # 1. VALIDATE — CI gate (PRs + pushes to main)
  # ----------------------------------------------------------------
  validate:
    name: Validate Migrations
    runs-on: ubuntu-latest
    # Run on PRs and on pushes to main.
    # Skip commits generated by the schema-publish job.
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[schema-bot]')

    steps:
      # ---- Checkout ------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- Install Supabase CLI -----------------------------------
      - name: Install Supabase CLI (v${{ env.SUPABASE_CLI_VERSION }})
        run: |
          curl -fsSL "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin supabase
          supabase --version

      # ---- Structural checks --------------------------------------
      - name: Verify project structure
        run: |
          echo "::group::Check config.toml"
          if [ ! -f supabase/config.toml ]; then
            echo "::error::supabase/config.toml is missing"
            exit 1
          fi
          echo "✔ config.toml exists"
          echo "::endgroup::"

          echo "::group::Check migrations directory"
          if [ ! -d supabase/migrations ]; then
            echo "::error::supabase/migrations/ directory is missing"
            exit 1
          fi
          echo "✔ migrations directory exists"
          echo "::endgroup::"

      # ---- Naming-convention & duplicate-version check -------------
      - name: Validate migration filenames
        run: |
          echo "::group::Migration filename validation"
          errors=0

          for file in supabase/migrations/*.sql; do
            [ -e "$file" ] || continue
            basename="$(basename "$file")"

            # Expected pattern: <14-digit timestamp>_<description>.sql
            if ! echo "$basename" | grep -qE '^[0-9]{14}_[a-z0-9_]+\.sql$'; then
              echo "::error file=${file}::Invalid filename format: ${basename} — expected <YYYYMMDDHHmmss>_<snake_case>.sql"
              errors=$((errors + 1))
            fi
          done

          # Check for duplicate timestamps (first 14 chars)
          dupes=$(ls supabase/migrations/*.sql 2>/dev/null \
            | xargs -I{} basename {} \
            | cut -c1-14 \
            | sort | uniq -d)

          if [ -n "$dupes" ]; then
            echo "::error::Duplicate migration timestamps detected: ${dupes}"
            errors=$((errors + 1))
          fi

          if [ "$errors" -gt 0 ]; then
            exit 1
          fi

          echo "✔ All migration filenames are valid"
          echo "::endgroup::"

      # ---- Start local Supabase stack (clean DB) -------------------
      - name: Start local Supabase environment
        run: |
          supabase start -x realtime,storage,imgproxy,edge-runtime,logflare,vector,supavisor

      # ---- Apply migrations ----------------------------------------
      - name: Apply migrations to local database
        run: |
          echo "::group::Running migrations"
          supabase db reset --debug
          echo "✔ All migrations applied successfully"
          echo "::endgroup::"

      # ---- Verify expected tables ----------------------------------
      - name: Verify menu tables exist
        run: |
          echo "::group::Table verification"

          EXPECTED_TABLES="food_menu menu_categories"

          # Query public-schema tables from the local Postgres instance
          TABLES=$(psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -t -A -c "
              SELECT tablename
              FROM pg_tables
              WHERE schemaname = 'public'
              ORDER BY tablename;
            ")

          echo "Tables found in public schema:"
          echo "$TABLES"

          for tbl in $EXPECTED_TABLES; do
            if ! echo "$TABLES" | grep -qw "$tbl"; then
              echo "::error::Expected table '${tbl}' was NOT created"
              exit 1
            fi
            echo "  ✔ ${tbl}"
          done

          # Ensure no unexpected application tables were introduced.
          # Allow only the two Cafe Connect tables (Supabase internal
          # tables live in other schemas and are not returned here).
          UNEXPECTED=$(echo "$TABLES" | grep -vwE "food_menu|menu_categories" || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::warning::Unexpected public tables detected: ${UNEXPECTED}"
            echo "Review whether these tables belong in the migration."
          fi

          echo "✔ Table verification passed"
          echo "::endgroup::"

      # ---- Verify RLS is enabled -----------------------------------
      - name: Verify Row Level Security
        run: |
          echo "::group::RLS verification"
          for tbl in menu_categories food_menu; do
            RLS=$(psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
              -t -A -c "
                SELECT rowsecurity
                FROM pg_tables
                WHERE schemaname = 'public' AND tablename = '${tbl}';
              ")
            if [ "$RLS" != "t" ]; then
              echo "::error::RLS is NOT enabled on table '${tbl}'"
              exit 1
            fi
            echo "  ✔ RLS enabled on ${tbl}"
          done
          echo "::endgroup::"

      # ---- Cleanup -------------------------------------------------
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  # ----------------------------------------------------------------
  # 2. DEPLOY — CD (push to main only)
  # ----------------------------------------------------------------
  deploy:
    name: Deploy Migrations to Supabase
    runs-on: ubuntu-latest
    needs: validate

    # NEVER run on pull requests. Only on push to main or manual dispatch.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main') &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[schema-bot]')

    permissions:
      contents: read

    environment: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI (v${{ env.SUPABASE_CLI_VERSION }})
        run: |
          curl -fsSL "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin supabase
          supabase --version

      - name: Link to Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"

      - name: Push pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "::group::Deploying migrations"
          supabase db push --linked
          echo "✔ Migrations deployed successfully"
          echo "::endgroup::"

  # ----------------------------------------------------------------
  # 3. PUBLISH SCHEMA — post-deploy snapshot
  # ----------------------------------------------------------------
  publish-schema:
    name: Generate & Publish Schema Snapshot
    runs-on: ubuntu-latest
    needs: deploy

    # Only runs after a successful deploy (which itself only runs on main).
    if: success()

    permissions:
      contents: write
      pull-requests: write

    environment: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use the built-in GITHUB_TOKEN so the PR comes from github-actions[bot]
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Install Supabase CLI (v${{ env.SUPABASE_CLI_VERSION }})
        run: |
          curl -fsSL "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin supabase
          supabase --version

      - name: Link to Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"

      - name: Verify pg_dump version compatibility
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "::group::pg_dump version check"

          # CLI v2.58.5 uses this PostgreSQL 17 image for db dumps.
          PG_DUMP_IMAGE="supabase/postgres:17.6.1.043"
          PG_DUMP_VERSION=$(docker run --rm "$PG_DUMP_IMAGE" pg_dump --version)
          echo "$PG_DUMP_VERSION"
          if ! echo "$PG_DUMP_VERSION" | grep -qE 'pg_dump \(PostgreSQL\) 17(\.|$)'; then
            echo "::error::Expected a PostgreSQL 17 pg_dump client from $PG_DUMP_IMAGE"
            exit 1
          fi

          dump_script=$(mktemp)
          if ! supabase db dump --linked --dry-run > "$dump_script"; then
            echo "::error::Supabase CLI could not generate the schema dump command"
            exit 1
          fi
          if ! grep -q 'pg_dump' "$dump_script"; then
            echo "::error::Generated schema dump command does not invoke pg_dump"
            exit 1
          fi

          echo "✔ pg_dump compatibility verified (PostgreSQL 17 client; config.toml major_version = 17)"
          echo "::endgroup::"

      - name: Export schema snapshot
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "::group::Exporting schema"

          # Dump the public schema (DDL only, no data, no ownership/ACLs).
          # Supabase-managed extensions and internal schemas are excluded
          # because we restrict the dump to --schema public.
          #
          # The CLI runs pg_dump inside a container whose PG version is
          # controlled by db.major_version in supabase/config.toml (= 17),
          # matching the remote PostgreSQL 17.x server.
          supabase db dump --linked \
            --schema public \
            > database/schema.sql

          echo "-- Generated by CI/CD pipeline on $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            >> database/schema.sql

          echo "✔ Schema exported to database/schema.sql"
          echo "::endgroup::"

      - name: Check for schema changes
        id: diff
        run: |
          if git diff --quiet database/schema.sql; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ℹ No schema changes detected — skipping PR."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "✔ Schema changes detected — will open PR."
          fi

      - name: Create schema-update pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(db): update schema snapshot [schema-bot] [skip ci]"
          branch: automated/schema-snapshot
          delete-branch: true
          title: "chore(db): update database/schema.sql"
          body: |
            **Automated schema snapshot** generated after successful migration deployment.

            This PR updates `database/schema.sql` to match the current state of the
            Supabase development database. Review the diff to confirm the changes
            match the recently merged migration(s).

            > ⚠️ Do **not** manually edit `database/schema.sql`. It is regenerated
            > on every deployment.
          labels: |
            database
            automated
